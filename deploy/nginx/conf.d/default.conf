server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static frontend assets root
    root /usr/share/nginx/html;
    index index.html;

    # Client body limit for file uploads (e.g. facility onboarding documents/geospatial shapes)
    client_max_body_size 50M;

    # Frontend Single-Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static assets caching
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Backend API routing
    location /api/ {
        proxy_pass http://reactx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Prometheus metrics scraper endpoint (restricted or internal)
    location /metrics {
        proxy_pass http://reactx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health & Readiness probe endpoints
    location /health {
        proxy_pass http://reactx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /readiness {
        proxy_pass http://reactx_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # OpenAPI Documentation
    location /docs {
        proxy_pass http://reactx_api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://reactx_api;
        proxy_set_header Host $host;
    }
}
