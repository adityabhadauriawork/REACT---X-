# ==============================================================================
# REACT-X Prometheus Scraping & Alerting Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # Scrape REACT-X FastAPI API Cluster
  - job_name: "reactx-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "reactx-api"
          tier: "national-hub"

  # Scrape Nginx Reverse Proxy
  - job_name: "reactx-nginx"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["nginx:80"]
        labels:
          environment: "production"
          service: "reactx-nginx"
